name: Sync Fork

on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git remote add upstream https://github.com/honue/MediaInfoKeeper.git
          git fetch upstream
          git checkout master
          git merge upstream/master
          git push origin master
